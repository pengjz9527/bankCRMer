version: "3.9"
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yihuiban_sim
      POSTGRES_USER: yihuiban
      POSTGRES_PASSWORD: yihuiban_dev
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yihuiban -d yihuiban_sim"]
      interval: 5s
      timeout: 3s
      retries: 10
